name: Build and Deploy

on:
  workflow_run:
    workflows: ["Unit Tests & Coverage"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tool-video

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
      revision: ${{ steps.image.outputs.revision }}
    steps:
      - name: Resolve image name
        id: image
        env:
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "value=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.value }}:latest
            ${{ steps.image.outputs.value }}:main
            ${{ steps.image.outputs.value }}:sha-${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ssh:
    name: Deploy to server
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_REVISION: ${{ needs.build-and-push.outputs.revision }}
      APP_IMAGE: ${{ needs.build-and-push.outputs.image }}:sha-${{ needs.build-and-push.outputs.revision }}
    steps:
      - name: Configure SSH
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull and restart application
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             git fetch origin main && \
             git checkout --detach '$DEPLOY_REVISION' && \
             APP_IMAGE='$APP_IMAGE' docker compose pull agnes && \
             APP_IMAGE='$APP_IMAGE' docker compose up -d --remove-orphans"

      - name: Verify deployment
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            for i in $(seq 1 30); do
              curl --fail --silent --show-error http://127.0.0.1:8765/api/auth/status >/dev/null && exit 0
              sleep 4
            done
            echo "Deployment health check failed"
            exit 1
          '
