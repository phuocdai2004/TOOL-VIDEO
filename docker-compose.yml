# Agnes Video Generator — 带本地持久化的启动配置
#
# 关键点：容器内的工作空间 /app/.working_dir 和配置目录 /app/.agnes_config
# 默认都在容器的「可写层」里，容器一删重建就会丢失。
# 下面用 bind mount 把这两个目录挂到宿主机 ./agnes_data/，
# 生成的视频、上传文件、设置都会直接落在本地磁盘，可随时拷出。
#
# 用法：
#   docker compose up -d
#   # 面板： http://localhost:8765
#   # 生成的文件在宿主机： ./agnes_data/working/
#
# API Key（可选）：用环境变量注入，避免写进镜像/配置
#   AGNES_API_KEY=你的key docker compose up -d
# 或在同级建 .env 文件写一行： AGNES_API_KEY=你的key

services:
  agnes:
    # GHCR 与 Docker Hub 二选一：
    #   image: ghcr.io/phuocdai2004/tool-video:5.2.0
    image: ${APP_IMAGE:-ghcr.io/phuocdai2004/tool-video:latest}
    container_name: agnes-video
    ports:
      - "8765:8765"
    environment:
      - AGNES_API_KEY=${AGNES_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/?serverSelectionTimeoutMS=5000}
      - MONGODB_DB=${MONGODB_DB:-agnes_video}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8765}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # 工作空间（任务目录、final_video.mp4、uploads/）
      - ./agnes_data/working:/app/.working_dir
      # 配置（API Key、工作空间列表等设置）
      - ./agnes_data/config:/app/.agnes_config
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: agnes-mongodb
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - ./agnes_data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
